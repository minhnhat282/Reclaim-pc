name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  NEXTDNS_VERSION: "1.49.0"

jobs:
  # Unit test của ReclaimEngine (dùng đối tượng giả, không đụng tới Windows). Chạy song song, độc lập với việc tạo file cài đặt:
  # test đỏ thì workflow đỏ, nhưng ReclaimSetup.exe vẫn được tạo để có thể thử tay.
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Chạy unit test
        run: dotnet test src/Reclaim.Tests/Reclaim.Tests.csproj -c Release --nologo

  build:
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: write   # chỉ dùng khi đẩy tag v* để tạo bản phát hành
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # nextdns.exe không nằm trong repo (.gitignore). Tải bản phát hành chính thức nếu chưa có.
      # Nếu có file third_party/nextdns/nextdns.sha256 (một dòng SHA-256 của nextdns.exe) thì BẮT BUỘC khớp.
      - name: Lấy và kiểm tra nextdns.exe
        shell: pwsh
        run: |
          $dest = "third_party/nextdns/nextdns.exe"
          if (-not (Test-Path $dest)) {
            $ver = $env:NEXTDNS_VERSION
            $asset = "nextdns_${ver}_windows_amd64.zip"
            $ok = $false
            foreach ($tag in @("v$ver", $ver)) {
              gh release download $tag --repo nextdns/nextdns --pattern $asset --dir nextdns-dl --clobber 2>$null
              if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            }
            if (-not $ok) { throw "Không tải được $asset từ nextdns/nextdns" }
            # Đối chiếu với checksums.txt do chính nextdns công bố cùng bản phát hành. Có file mà không khớp hoặc không liệt kê
            # gói này thì dừng build; không tải được file thì chỉ cảnh báo.
            gh release download $tag --repo nextdns/nextdns --pattern checksums.txt --dir nextdns-dl --clobber 2>$null
            $sums = "nextdns-dl/checksums.txt"
            if ($LASTEXITCODE -eq 0 -and (Test-Path $sums)) {
              $zipHash = (Get-FileHash "nextdns-dl/$asset" -Algorithm SHA256).Hash.ToLower()
              $line = Get-Content $sums | Where-Object { $_ -match [regex]::Escape($asset) } | Select-Object -First 1
              if (-not $line) { throw "checksums.txt chính thức không liệt kê $asset" }
              $official = ([regex]::Match($line, '[0-9a-fA-F]{64}')).Value.ToLower()
              if ($zipHash -ne $official) { throw "SHA-256 của $asset ($zipHash) không khớp checksums.txt chính thức ($official)" }
              Write-Host "Đã xác minh $asset với checksums.txt chính thức."
              "$asset khớp checksums.txt chính thức của nextdns." | Out-File -Append $env:GITHUB_STEP_SUMMARY
            } else {
              Write-Warning "Không tải được checksums.txt chính thức để đối chiếu."
            }
            Expand-Archive "nextdns-dl/$asset" -DestinationPath nextdns-dl/x -Force
            $exe = Get-ChildItem nextdns-dl/x -Recurse -Filter nextdns.exe | Select-Object -First 1
            if (-not $exe) { throw "Không thấy nextdns.exe trong $asset" }
            Copy-Item $exe.FullName $dest
          }
          # nextdns dùng giấy phép MIT: phải kèm văn bản giấy phép khi phân phối. Lấy đúng từ repo gốc ở thẻ phiên bản.
          $lic = "third_party/nextdns/LICENSE.txt"
          if (-not (Test-Path $lic)) {
            $got = $false
            foreach ($tag in @("v$env:NEXTDNS_VERSION", $env:NEXTDNS_VERSION)) {
              $txt = gh api "repos/nextdns/nextdns/contents/LICENSE?ref=$tag" -H "Accept: application/vnd.github.raw"
              if ($LASTEXITCODE -eq 0 -and $txt) { $txt | Out-File $lic -Encoding utf8NoBOM; $got = $true; break }
            }
            if (-not $got) { throw "Không lấy được LICENSE của nextdns" }
          }
          $hash = (Get-FileHash $dest -Algorithm SHA256).Hash.ToLower()
          "nextdns.exe SHA-256: ``$hash``" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          $pin = "third_party/nextdns/nextdns.sha256"
          if (Test-Path $pin) {
            $expected = (Get-Content $pin -Raw).Trim().ToLower()
            if ($hash -ne $expected) { throw "SHA-256 nextdns.exe không khớp. Mong đợi $expected, nhận $hash" }
            Write-Host "SHA-256 khớp với $pin"
          } else {
            Write-Warning "Chưa có $pin nên không ghim hash. Hãy chép giá trị trên vào file đó (xem README)."
          }

      - uses: microsoft/setup-msbuild@v2

      - name: Build Release
        run: msbuild Reclaim.sln /restore /p:Configuration=Release /t:Rebuild /v:minimal

      - name: Kiểm tra đầu ra build
        shell: pwsh
        run: |
          foreach ($f in "build/Release/Reclaim.exe","build/Release/Reclaim.Service.exe","build/Release/nextdns/nextdns.exe","build/Release/nextdns/LICENSE.txt") {
            if (-not (Test-Path $f)) { throw "Thiếu $f sau khi build" }
          }

      - name: Tạo file cài đặt (Inno Setup)
        shell: pwsh
        run: |
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw "Không tìm thấy ISCC.exe" }
          & $iscc installer\Reclaim.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC thất bại" }

      - uses: actions/upload-artifact@v4
        with:
          name: ReclaimSetup
          path: installer/Output/ReclaimSetup.exe
          if-no-files-found: error

      - name: Tạo bản phát hành (khi đẩy tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: gh release create "${{ github.ref_name }}" installer/Output/ReclaimSetup.exe --title "Reclaim ${{ github.ref_name }}" --generate-notes
